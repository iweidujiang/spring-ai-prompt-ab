spring:
  application:
    name: spring-ai-prompt-ab-example
  datasource:
    url: jdbc:h2:mem:promptab;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
  flyway:
    enabled: false

prompt-ab:
  enabled: true
  default-routing-strategy: HASH
  default-experiment-key: demo-chat
  log-level: DEBUG
